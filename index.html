<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Meet</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />
</head>

<body>

  <header>
    <div class="header-left">
      <span class="app-title">WebRTC Meet</span>
    </div>
    <div class="header-center">
      <span class="chip">Room: <span id="room">—</span></span>
    </div>
    <div class="header-right">
      <span class="chip">ID: <span id="id">—</span></span>
      <button id="joinButton" class="btn-join">Join</button>
      <button id="chatToggle" class="btn-icon-header" title="In-call messages">
        <span class="material-icons">chat</span>
      </button>
    </div>
  </header>

  <div id="rtc">
    <div id="videoArea">
      <div id="remoteVideoContainer"></div>

      <div id="localScreenShare">
        <div class="screen-label">Your screen</div>
        <video id="localScreen" autoplay playsinline></video>
      </div>

      <div id="localVideoContainer">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="local-label">You</div>
      </div>
    </div>

    <div id="messagesContainer">
      <div class="chat-header">
        <span>In-call messages</span>
        <button id="chatClose" class="btn-icon-header" title="Close">
          <span class="material-icons">close</span>
        </button>
      </div>
      <ul id="messages"></ul>
      <div class="message-input-row">
        <textarea id="newMessage" placeholder="Send a message to everyone" rows="1"></textarea>
        <button id="sendMessage" class="btn-send" title="Send">
          <span class="material-icons">send</span>
        </button>
      </div>
    </div>
  </div>

  <div id="controlBar">
    <div class="ctrl-group">
      <button id="toggleLocalAudio" class="ctrl-btn" title="Mute">
        <span class="material-icons">mic</span>
      </button>
      <button id="toggleLocalVideo" class="ctrl-btn" title="Turn off camera">
        <span class="material-icons">videocam</span>
      </button>
      <button id="toggleLocalScreen" class="ctrl-btn" title="Share screen">
        <span class="material-icons">present_to_all</span>
      </button>
    </div>
    <button id="hangupButton" class="ctrl-btn ctrl-hangup" title="Leave call">
      <span class="material-icons">call_end</span>
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  <script src="js/main.js"></script>

</body>

</html>
