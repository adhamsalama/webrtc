<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Conference</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>

<body>

  <header>
    <span class="app-title">WebRTC Conference</span>
    <div class="status-chips">
      <span class="chip">Room: <span id="room">—</span></span>
      <span class="chip">ID: <span id="id">—</span></span>
      <button id="joinButton">Join Room</button>
      <button id="hangupButton" class="btn-danger">Hangup</button>
    </div>
  </header>

  <div id="rtc">
    <div id="localVideoContainer">
      <h2>You</h2>
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="controls">
        <button id="toggleLocalVideo">Pause Video</button>
        <button id="toggleLocalAudio">Pause Audio</button>
        <button id="toggleLocalScreen">Share Screen</button>
      </div>
      <div id="localScreenShare">
        <h3>Screen Share</h3>
        <video id="localScreen" autoplay playsinline></video>
      </div>
    </div>

    <div id="remoteVideoContainer"></div>

    <div id="messagesContainer">
      <h2>Chat</h2>
      <ul id="messages"></ul>
      <div class="message-input-row">
        <textarea name="message" id="newMessage" placeholder="Type a message…" rows="2"></textarea>
        <button id="sendMessage">Send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  <script src="js/main.js"></script>

</body>

</html>
